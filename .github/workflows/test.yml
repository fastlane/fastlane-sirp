name: Test

on:
  pull_request:
    branches:
      - master
  push:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ruby-version: ['4.0']
        include:
          - os: ubuntu-latest
            ruby-version: '3.3'
          - os: ubuntu-latest
            ruby-version: '3.4'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.os }}-ruby-${{ matrix.ruby-version }}
          path: test-results
